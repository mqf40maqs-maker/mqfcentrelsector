const chips=l=>l.map(p=>{const on=ids.has(p.id),full=!on&&(S.regs.filter(r=>r.t==s.t&&r.pid==p.id).length>=p.max||cnt(p.st=='O')>=(p.st=='O'?S.lim.O:S.lim.S));return`<button type="button" class="chp${on?' on':''}${full||!S.open?' dis':''}" aria-pressed="${on}" onclick="togProg(${s.id},${p.id})">${esc(p.name)}</button>`}).join('');

async function addStu(){if(!S.open)return;const n=g('sn');if(!n)return msg('Enter the student’s name.');if(S.stu.some(x=>x.t==me.t&&x.n.toLowerCase()==n.toLowerCase()))return msg('This student already has a card below.');const d=await SB.from('students').insert({team:me.t,name:n,student_class:g('sc'),zone:E('sz').value}).select().single();if(d.error)return msg(d.error.message);S.stu.push({id:d.data.id,t:me.t,n:d.data.name,c:d.data.student_class||'',z:d.data.zone});team()}
async function delStu(id){const s=S.stu.find(x=>x.id==id);if(!s||!await cf('Remove this student and their registrations?'))return;const ids=S.regs.filter(r=>r.t==s.t&&r.n==s.n&&PR(r.pid).type=='I').map(r=>r.id);if(ids.length){const a=await SB.from('regs').delete().in('id',ids);if(a.error)return msg(a.error.message,'tm')}const d=await SB.from('students').delete().eq('id',id);if(d.error)return msg(d.error.message,'tm');S.regs=S.regs.filter(r=>!ids.includes(r.id));S.stu=S.stu.filter(x=>x.id!=id);team()}
async function togProg(sid,pid){if(!S.open)return;const s=S.stu.find(x=>x.id==sid),p=PR(pid),y=scrollY;if(!s||!p.id)return;const ex=S.regs.find(r=>r.t==s.t&&r.n==s.n&&r.pid==pid);
if(ex){const d=await SB.from('regs').delete().eq('id',ex.id);if(d.error)return msg(d.error.message,'tm');S.regs=S.regs.filter(r=>r.id!=ex.id)}
else{const mine=S.regs.filter(r=>r.t==s.t&&r.n==s.n&&PR(r.pid).type=='I'&&(PR(r.pid).st=='O')==(p.st=='O')).length;if(mine>=(p.st=='O'?S.lim.O:S.lim.S))return msg('This student has reached the limit for '+(p.st=='O'?'off-stage':'stage')+' programs.','tm');if(S.regs.filter(r=>r.t==s.t&&r.pid==pid).length>=p.max)return msg('Your campus already has '+p.max+' entries in this program.','tm');
const xg=p.zone=='X'||p.zone=='G',row={program_id:pid,team:s.t,name:s.n,student_class:s.c,zone:xg?p.zone:s.z};let d=await SB.from('regs').insert(row).select().single();if(d.error&&xg&&!/regs_unique/.test(d.error.message)){row.zone='M';d=await SB.from('regs').insert(row).select().single()}
if(d.error)return msg(/regs_unique/.test(d.error.message)?'This student is already registered for this program.':d.error.message,'tm');S.regs.push({id:d.data.id,pid,t:s.t,n:s.n,c:s.c,z:row.zone,at:true,cd:''})}
team();scrollTo(0,y)}

function judge(){E('app').innerHTML=`<section class="wrap"><h2>Valuation</h2><p class="mute">Choose a program. You see only code letters, never names. Once you save, the sheet is locked and only the coordinator can edit it.</p><label>Program<select id="jp" onchange="jSel()"><option value="">Select a program</option>${OG(srt(),p=>`<option value="${p.id}"${p.id==JV.pid?' selected':''}>${esc(p.name)} (${meta(p)})${(S.jh||[]).includes(p.id)?' · closed':''}</option>`)}</select></label><div id="jbox"></div><p><button class="btn o" onclick="logout()">Log out</button></p></section>`;if(JV.pid)jSel()}
async function jSel(){const id=+E('jp').value;JV.pid=id;const b=E('jbox');if(!id){b.innerHTML='';return}b.innerHTML='<p class="mute">Loading…</p>';const ss=await SB.auth.getSession();JV.em=(ss.data.session&&ss.data.session.user.email)||'';
const[a,s,r]=await Promise.all([SB.rpc('judge_entries',{p_program:id}),SB.from('eval_sheets').select('*').eq('program_id',id).maybeSingle(),SB.from('evals').select('code,marks,grade,place').eq('program_id',id)]);
if((S.jh||[]).includes(id)){const dn=s.data||(r.data&&r.data.length);b.innerHTML=`<div class="card"><span class="pill ok">${dn?'Already valuated':'Closed'}</span><p class="mute">${dn?'This programme has already been valuated.':'This programme is closed for valuation by the coordinator.'}</p></div>`;return}
if(a.error){b.innerHTML='<p class="bad">'+esc(a.error.message)+'</p>';return}
const codes=(a.data||[]).map(x=>x.code),rows=r.data||[],lock=s.data&&s.data.locked;JV.codes=codes;
if(!codes.length){b.innerHTML='<p class="mute">No code letters have been given for this program yet. Ask the coordinator.</p>';return}
const nm=(s.data&&s.data.judge_names)||[],v=c=>rows.find(x=>x.code==c)||{};
b.innerHTML=inf(PR(id))+(lock?`<div class="card"><span class="pill ok">Saved and locked</span><p class="mute"><small>Judge login: ${esc(nm.filter(Boolean).join(', ')||'–')}. Only the coordinator can edit this sheet now.</small></p><div class="tw"><table class="ct"><thead><tr><th>Code</th><th>Marks</th><th>Grade</th><th>Place</th></tr></thead><tbody>${codes.map(c=>`<tr><td><b>${esc(c)}</b></td><td>${v(c).marks??'–'}</td><td>${esc(v(c).grade||'')||'–'}</td><td>${v(c).place||'–'}</td></tr>`).join('')}</tbody></table></div></div>`
:`<div class="tw"><table class="ct"><thead><tr><th>Code</th><th>Marks</th><th>Grade</th><th>Place</th></tr></thead><tbody>${codes.map((c,i)=>`<tr><td><b>${esc(c)}</b></td><td><input class="sm" id="jm${i}" type="number" step="any" min="0" inputmode="decimal" style="width:5.5rem" value="${v(c).marks??''}"></td><td><select class="sm" id="jg${i}"><option value="">–</option>${S.gr.map(x=>`<option${v(c).grade==x.g?' selected':''}>${esc(x.g)}</option>`).join('')}</select></td><td><select class="sm" id="jl${i}"><option value="0">–</option>${[1,2,3].map(k=>`<option value="${k}"${v(c).place==k?' selected':''}>${k}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div><p class="mute"><small>Judge login: <b>${esc(JV.em||'')}</b>. Your login is recorded as the judge of this sheet.</small></p><p id="jmsg" class="bad"></p><button class="btn" onclick="jSave()">Save valuation</button>`)}
async function jSave(){const out=[],pl=new Set();for(let i=0;i<JV.codes.length;i++){const m=E('jm'+i).value,gr=E('jg'+i).value,p=+E('jl'+i).value;if(m===''&&!gr&&!p)continue;if(m!==''&&!(+m>=0))return msg('Marks must be a number.','jmsg');if(p){if(pl.has(p))return msg('Place '+p+' is given twice.','jmsg');pl.add(p)}out.push({code:JV.codes[i],marks:m===''?null:+m,grade:gr||null,place:p||null})}
if(!out.length)return msg('Enter marks, a grade or a place for at least one code.','jmsg');const jn=[JV.em||'',''];if(!jn[0])return msg('Could not read your login. Please log in again.','jmsg');if(!await cf('Save this valuation? After saving, only the coordinator can edit it.'))return;
const{error}=await SB.rpc('judge_save',{p_program:JV.pid,p_rows:out,p_names:jn});if(error)return msg(error.message,'jmsg');jSel()}

function evCard(x,i){const p=PR(x.program_id);if(!p.id)return'';const rs=x.items||[];return`<div class="card fi"><div class="rh"><b>${esc(p.name)}</b><b class="zb">${PZ[p.zone]}</b></div><div class="mute"><small>Judge login: ${esc(x.judge_email||'unknown')}, ${new Date(x.saved_at).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit',hour12:true})}</small></div>${inf(p)}<div class="tw"><table class="ct"><thead><tr><th>Code</th><th>Marks</th><th>Grade</th><th>Place</th><th>Entry</th></tr></thead><tbody>${rs.map((w,j)=>{const r=S.regs.find(q=>q.pid==p.id&&q.cd==w.code);return`<tr><td><b>${esc(w.code)}</b></td><td><input class="sm" id="em${i}_${j}" type="number" step="any" min="0" style="width:5.5rem" value="${w.marks??''}" onchange="evEdit(${i})"></td><td><select class="sm" id="eg${i}_${j}" onchange="evEdit(${i})"><option value="">–</option>${S.gr.map(g=>`<option${w.grade==g.g?' selected':''}>${esc(g.g)}</option>`).join('')}</select></td><td><select class="sm" id="el${i}_${j}" onchange="evEdit(${i})"><option value="0">–</option>${[1,2,3].map(k=>`<option value="${k}"${w.place==k?' selected':''}>${k}</option>`).join('')}</select></td><td>${r?esc(gn(p,r.n))+' <small class="mute">'+T[r.t].n+'</small>':'<span class="bad">no entry</span>'}</td></tr>`}).join('')}</tbody></table></div><div>${x.locked?'<span class="pill">Locked</span>':'<span class="pill ok">Open for judge</span>'} ${x.sent?'<span class="pill ok">Sent to call list</span>':''}${(S.jh||[]).includes(p.id)?' <span class="pill">Hidden from judges</span>':''}</div><button class="btn s o" onclick="evLock(${i},${!x.locked})">${x.locked?'Unlock':'Lock'}</button> <button class="btn s o" onclick="togJH(${p.id})">${(S.jh||[]).includes(p.id)?'Show to judges':'Hide from judges'}</button> <button class="btn s" onclick="evSend(${i})"${x.locked?'':' disabled'}>${x.sent?'Send again':'Send to call list'}</button></div>`}
async function evEdit(i){const x=S.ev[i],out=[],pl=new Set(),m=E('evm'),er=t=>{m.className='bad';m.textContent=t};for(let j=0;j<(x.items||[]).length;j++){const mk=E('em'+i+'_'+j).value,g=E('eg'+i+'_'+j).value,p=+E('el'+i+'_'+j).value;if(mk!==''&&!(+mk>=0))return er('Marks must be a number.');if(p){if(pl.has(p))return er('Place '+p+' is given twice.');pl.add(p)}out.push({code:x.items[j].code,marks:mk===''?null:+mk,grade:g||null,place:p||null})}
const nm=x.judge_names||[x.judge_email||'',''],{error}=await SB.rpc('coord_eval_save',{p_program:x.program_id,p_judge:x.judge,p_rows:out,p_names:nm});if(error)return er(error.message);x.items=out;x.judge_names=nm;x.sent=false;m.className='mute';m.textContent='Saved. Send it to the call list again to update the result.'}
